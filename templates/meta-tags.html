<!--
  Meta Tag Templates for The Rojas Report Network

  Replace all [BRACKETED] values with actual content.
  Deploy these in the <head> section of every page.

  Domain-specific instructions:
  - RojasReport.com: Use "The Rojas Report" as site name
  - POH subdomain: Use "POH | The Rojas Report"
  - FAH subdomain: Use "FAH Watch | The Rojas Report"
  - AHA subdomain: Use "AHA Watch | The Rojas Report"
  - Academic subdomain: Use "Academic | The Rojas Report"
-->

<!-- ========================================== -->
<!-- ESSENTIAL META TAGS (required on all pages) -->
<!-- ========================================== -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Page Title: < 60 chars, primary keyword near start, brand at end -->
<title>[PRIMARY KEYWORD] - [Descriptor] | The Rojas Report</title>

<!-- Meta Description: 120-160 chars, includes keyword, compelling -->
<meta name="description" content="[Compelling description with primary keyword. Include value proposition. 120-160 characters.]">

<!-- Canonical URL: prevents duplicate content -->
<link rel="canonical" href="https://[DOMAIN]/[PAGE-PATH]">

<!-- Robots: index and follow by default -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

<!-- Author -->
<meta name="author" content="Dutch Rojas">


<!-- ========================================== -->
<!-- OPEN GRAPH TAGS (Facebook, LinkedIn)       -->
<!-- ========================================== -->

<meta property="og:type" content="article">
<meta property="og:title" content="[ARTICLE TITLE - can be longer than <title>, up to 95 chars]">
<meta property="og:description" content="[Description optimized for social sharing. 200 chars max.]">
<meta property="og:image" content="https://[DOMAIN]/images/[SHARE-IMAGE].jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="[Descriptive alt text for the share image]">
<meta property="og:url" content="https://[DOMAIN]/[PAGE-PATH]">
<meta property="og:site_name" content="The Rojas Report">
<meta property="og:locale" content="en_US">

<!-- For article pages, add these: -->
<meta property="article:published_time" content="[YYYY-MM-DDTHH:MM:SSZ]">
<meta property="article:modified_time" content="[YYYY-MM-DDTHH:MM:SSZ]">
<meta property="article:author" content="https://rojasreport.com/about">
<meta property="article:section" content="[CATEGORY]">
<meta property="article:tag" content="[TAG1]">
<meta property="article:tag" content="[TAG2]">


<!-- ========================================== -->
<!-- TWITTER CARD TAGS                          -->
<!-- ========================================== -->

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@[TWITTER_HANDLE]">
<meta name="twitter:creator" content="@[DUTCH_ROJAS_TWITTER]">
<meta name="twitter:title" content="[ARTICLE TITLE - max 70 chars]">
<meta name="twitter:description" content="[Description for Twitter - max 200 chars]">
<meta name="twitter:image" content="https://[DOMAIN]/images/[SHARE-IMAGE].jpg">
<meta name="twitter:image:alt" content="[Descriptive alt text]">


<!-- ========================================== -->
<!-- STRUCTURED DATA (JSON-LD)                  -->
<!-- ========================================== -->
<!-- Place in <head> or at end of <body> -->

<!-- WebSite schema (homepage only) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://[DOMAIN]/#website",
  "name": "The Rojas Report",
  "url": "https://[DOMAIN]",
  "publisher": {
    "@type": "Organization",
    "@id": "https://rojasreport.com/#organization"
  }
}
</script>

<!-- Article schema (article pages) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "[ARTICLE HEADLINE]",
  "datePublished": "[YYYY-MM-DD]",
  "dateModified": "[YYYY-MM-DD]",
  "author": {
    "@type": "Person",
    "@id": "https://rojasreport.com/#dutch-rojas",
    "name": "Dutch Rojas"
  },
  "publisher": {
    "@type": "Organization",
    "@id": "https://rojasreport.com/#organization"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://[DOMAIN]/[PAGE-PATH]"
  }
}
</script>

<!-- BreadcrumbList schema (all pages) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://[DOMAIN]"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "[CURRENT PAGE]",
      "item": "https://[DOMAIN]/[PAGE-PATH]"
    }
  ]
}
</script>


<!-- ========================================== -->
<!-- ADDITIONAL RECOMMENDED TAGS                -->
<!-- ========================================== -->

<!-- RSS Feed (if available) -->
<link rel="alternate" type="application/rss+xml" title="The Rojas Report" href="https://[DOMAIN]/feed">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Preconnect to important origins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://www.google-analytics.com">
